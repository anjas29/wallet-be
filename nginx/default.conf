server {
    listen 80;
    server_name localhost;

    # Allow avatar uploads up to the app's 2 MB rule, plus multipart overhead.
    client_max_body_size 3m;

    location / {
        proxy_pass http://app:8000;

        # SSE: POST /api/v1/ai/chat holds the connection open while the model works, which can
        # exceed the 60s default. Response buffering needs no change here — Laravel's
        # eventStream() sends X-Accel-Buffering: no, which nginx honours per-response.
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}