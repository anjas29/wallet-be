# On the VPS, Traefik terminates TLS and forwards here over plain HTTP, already setting
# X-Forwarded-Proto: https — nginx's own $scheme is always "http" in that hop, so blindly
# using $scheme (as most nginx examples do) would overwrite Traefik's correct value. This
# preserves whatever the upstream already set, falling back to $scheme only when accessed
# directly (e.g. local dev, with no proxy in front of nginx at all).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Allow avatar uploads up to the app's 2 MB rule, plus multipart overhead.
    client_max_body_size 3m;

    location / {
        proxy_pass http://app:8000;

        # SSE: POST /api/v1/ai/chat holds the connection open while the model works, which can
        # exceed the 60s default. Response buffering needs no change here — Laravel's
        # eventStream() sends X-Accel-Buffering: no, which nginx honours per-response.
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}